<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer Address</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    {% include "navbar.html" %}

    <div class="container">
        <div class="row justify-content-center mt-5">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h3>Add Customer Address</h3>
                    </div>

                    <div class="card-body">

                        <form method="POST">

                            <!-- Customer ID -->
                            <div class="mb-3">
                                <label class="form-label">Customer ID</label>
                                <input type="number" name="customer_id" class="form-control"
                                    placeholder="Enter customer ID" required>
                            </div>

                            <!-- Address Type -->
                            <div class="mb-3">
                                <label class="form-label">Address Type</label>

                                <select name="address_type" class="form-select">
                                    <option value="" selected disabled>
                                        Select address type
                                    </option>
                                    <option value="Home">Home</option>
                                    <option value="Work">Work</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <!-- Address Line 1 -->
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" name="address_line1" class="form-control"
                                    placeholder="Enter address">
                            </div>

                            <!-- City -->
                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text" name="city" class="form-control" placeholder="Enter city">
                            </div>

                            <!-- State -->
                            <div class="mb-3">
                                <label class="form-label">State</label>
                                <input type="text" name="state" class="form-control" placeholder="Enter state">
                            </div>

                            <!-- Pincode -->
                            <div class="mb-3">
                                <label class="form-label">Pincode</label>
                                <input type="text" name="pincode" class="form-control" placeholder="Enter pincode">
                            </div>

                            <!-- Is Default -->
                            <div class="mb-3">
                                <label class="form-label">Default Address</label>

                                <select name="is_default" class="form-select">
                                    <option value="" selected disabled>
                                        Select option
                                    </option>
                                    <option value="1">Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Add Address
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
