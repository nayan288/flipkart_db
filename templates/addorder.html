<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Order</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Navbar -->
    {% include 'navbar.html' %}

    <div class="container">
        <div class="row justify-content-center mt-5 mb-5">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h3>Create Order</h3>
                    </div>

                    <div class="card-body">

                        <form method="POST">

                            <!-- Customer ID -->
                            <div class="mb-3">
                                <label class="form-label">Customer ID</label>
                                <input type="number" name="customer_id" class="form-control"
                                    placeholder="Enter customer ID" required>
                            </div>

                            <!-- Order Date -->
                            <div class="mb-3">
                                <label class="form-label">Order Date</label>
                                <input type="datetime-local" name="order_date" class="form-control"
                                    placeholder="Select order date">
                            </div>

                            <!-- Status -->
                            <div class="mb-3">
                                <label class="form-label">Order Status</label>
                                <select name="status" class="form-select">
                                    <option value="" selected disabled>
                                        Select order status
                                    </option>
                                    <option value="Pending">Pending</option>
                                    <option value="Confirmed">Confirmed</option>
                                    <option value="Processing">Processing</option>
                                    <option value="Shipped">Shipped</option>
                                    <option value="Delivered">Delivered</option>
                                    <option value="Cancelled">Cancelled</option>
                                </select>
                            </div>

                            <!-- Shipping Address ID -->
                            <div class="mb-3">
                                <label class="form-label">Shipping Address ID</label>
                                <input type="number" name="shipping_address_id" class="form-control"
                                    placeholder="Enter shipping address ID">
                            </div>

                            <!-- Coupon ID -->
                            <div class="mb-3">
                                <label class="form-label">Coupon ID</label>
                                <input type="number" name="coupon_id" class="form-control"
                                    placeholder="Enter coupon ID">
                            </div>

                            <!-- Subtotal -->
                            <div class="mb-3">
                                <label class="form-label">Subtotal</label>
                                <input type="number" step="0.01" name="subtotal" class="form-control"
                                    placeholder="Enter subtotal">
                            </div>

                            <!-- Discount Amount -->
                            <div class="mb-3">
                                <label class="form-label">Discount Amount</label>
                                <input type="number" step="0.01" name="discount_amt" class="form-control"
                                    placeholder="Enter discount amount">
                            </div>

                            <!-- Shipping Charges -->
                            <div class="mb-3">
                                <label class="form-label">Shipping Charges</label>
                                <input type="number" step="0.01" name="shipping_charges" class="form-control"
                                    placeholder="Enter shipping charges">
                            </div>

                            <!-- Tax Amount -->
                            <div class="mb-3">
                                <label class="form-label">Tax Amount</label>
                                <input type="number" step="0.01" name="tax_amt" class="form-control"
                                    placeholder="Enter tax amount">
                            </div>

                            <!-- Total Amount -->
                            <div class="mb-3">
                                <label class="form-label">Total Amount</label>
                                <input type="number" step="0.01" name="total_amount" class="form-control"
                                    placeholder="Enter total amount">
                            </div>

                            <!-- Payment Status -->
                            <div class="mb-3">
                                <label class="form-label">Payment Status</label>
                                <select name="payment_status" class="form-select">
                                    <option value="" selected disabled>
                                        Select payment status
                                    </option>
                                    <option value="Pending">Pending</option>
                                    <option value="Paid">Paid</option>
                                    <option value="Failed">Failed</option>
                                    <option value="Refunded">Refunded</option>
                                </select>
                            </div>

                            <!-- Delivery Date -->
                            <div class="mb-3">
                                <label class="form-label">Delivery Date</label>
                                <input type="datetime-local" name="delivery_date" class="form-control">
                            </div>

                            <!-- Warehouse ID -->
                            <div class="mb-3">
                                <label class="form-label">Warehouse ID</label>
                                <input type="number" name="warehouse_id" class="form-control"
                                    placeholder="Enter warehouse ID">
                            </div>

                            <!-- Channel -->
                            <div class="mb-3">
                                <label class="form-label">Channel</label>
                                <select name="channel" class="form-select">
                                    <option value="" selected disabled>
                                        Select channel
                                    </option>
                                    <option value="App">App</option>
                                    <option value="Website">Website</option>
                                    <option value="Mobile Web">Mobile Web</option>
                                </select>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Create Order
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
